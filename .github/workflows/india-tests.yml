name: India paper-trading tests

on:
  push:
    branches: [india-nse-paper]
  pull_request:
    branches: [india-nse-paper]

jobs:
  india-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements-india.txt
      - name: Run India core tests
        run: python -m unittest discover -s tests -p 'test_india_core.py' -v
      - name: Check backend imports
        run: python -c "from backend.kite_auth import app; print(app.title)"
